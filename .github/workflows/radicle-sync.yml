name: Sync from Radicle and generate source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: radicle-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Radicle
        run: |
          curl -sSLf https://radicle.xyz/install | sh
          export PATH="$HOME/.radicle/bin:$PATH"
          echo "$HOME/.radicle/bin" >> "$GITHUB_PATH"
          rad --version

      - name: Initialize Radicle profile
        run: |
          export PATH="$HOME/.radicle/bin:$PATH"
          rad auth --alias "github-actions-bot" --stdin < /dev/null

      - name: Clone Radicle repository
        run: |
          export PATH="$HOME/.radicle/bin:$PATH"
          rm -rf "$RUNNER_TEMP/radicle-source" "$RUNNER_TEMP/radicle-clone"
          mkdir -p "$RUNNER_TEMP/radicle-clone"
          cd "$RUNNER_TEMP/radicle-clone"

          rad node start

          echo "Waiting for the Radicle node to come online..."
          for i in {1..30}; do
            if rad node status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          rad node status

          echo "Waiting for Radicle seed discovery..."
          cloned=0
          for attempt in {1..12}; do
            echo "Clone attempt $attempt/12"

            if rad clone rad:z2BWVCwcwTyoQ2veMJLb1eFpMtJDj; then
              cloned=1
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "Radicle repository could not be discovered after 12 attempts."
              rad node status || true
              rad node logs --tail 100 || true
              exit 1
            fi

            echo "No usable seed yet; waiting 5 seconds before retrying..."
            find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
            sleep 5
          done

          test "$cloned" -eq 1

          source_dir="$(find . -mindepth 2 -maxdepth 2 -type d -name .git -print -quit | sed 's#/.git$##')"
          test -n "$source_dir"
          mv "$source_dir" "$RUNNER_TEMP/radicle-source"
          test -d "$RUNNER_TEMP/radicle-source"
          test -d "$RUNNER_TEMP/radicle-source/.git"

      - name: Check out GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Mirror Radicle working tree
        run: |
          rsync -a --delete             --exclude='.git/'             --exclude='.github/workflows/radicle-sync.yml'             "$RUNNER_TEMP/radicle-source/" ./

      - name: Commit and push main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Radicle repository is already synchronized."
          else
            git commit -m "Sync workspace from Radicle"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Vineflower 1.12.0
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fL             -o "$RUNNER_TEMP/tools/vineflower-1.12.0.jar"             "https://repo1.maven.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar"
          test -s "$RUNNER_TEMP/tools/vineflower-1.12.0.jar"
          sha256sum "$RUNNER_TEMP/tools/vineflower-1.12.0.jar"

      - name: Decompile client JAR
        run: |
          rm -rf "$RUNNER_TEMP/generated-source"
          mkdir -p "$RUNNER_TEMP/generated-source"

          java -Xmx8g -jar "$RUNNER_TEMP/tools/vineflower-1.12.0.jar"             --log-level=warn             -dgs=1             -rsy=1             "$GITHUB_WORKSPACE/Input/client.jar"             "$RUNNER_TEMP/generated-source"

          test -d "$RUNNER_TEMP/generated-source"
          java_files="$(find "$RUNNER_TEMP/generated-source" -type f -name '*.java' | wc -l)"
          echo "Generated Java files: $java_files"
          test "$java_files" -gt 0

      - name: Publish generated source to src branch
        run: |
          git fetch origin main src || true

          # Always rebuild src from the newest synchronized main commit.
          git checkout -B src origin/main

          rm -rf generated-source
          mkdir -p generated-source
          rsync -a "$RUNNER_TEMP/generated-source/" generated-source/

          git add -A generated-source

          if git diff --cached --quiet; then
            echo "Generated source is already synchronized on src."
            exit 0
          fi

          git commit -m "Generate Minecraft 26.2 source"
          git push --force-with-lease origin HEAD:src
