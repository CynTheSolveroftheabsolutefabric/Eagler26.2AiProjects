name: Sync from Radicle and generate source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: radicle-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Radicle
        run: |
          curl -sSLf https://radicle.xyz/install | sh
          export PATH="$HOME/.radicle/bin:$PATH"
          echo "$HOME/.radicle/bin" >> "$GITHUB_PATH"
          rad --version

      - name: Initialize Radicle profile
        run: |
          export PATH="$HOME/.radicle/bin:$PATH"
          rad auth --alias "github-actions-bot" --stdin < /dev/null

      - name: Clone Radicle repository
        run: |
          export PATH="$HOME/.radicle/bin:$PATH"
          rm -rf "$RUNNER_TEMP/radicle-source" "$RUNNER_TEMP/radicle-clone"
          mkdir -p "$RUNNER_TEMP/radicle-clone"
          cd "$RUNNER_TEMP/radicle-clone"

          rad node start

          echo "Waiting for the Radicle node to come online..."
          for i in {1..30}; do
            if rad node status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          rad node status

          echo "Waiting for Radicle seed discovery..."
          cloned=0
          for attempt in {1..12}; do
            echo "Clone attempt $attempt/12"

            if rad clone rad:z2BWVCwcwTyoQ2veMJLb1eFpMtJDj; then
              cloned=1
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "Radicle repository could not be discovered after 12 attempts."
              rad node status || true
              rad node logs --tail 100 || true
              exit 1
            fi

            echo "No usable seed yet; waiting 5 seconds before retrying..."
            find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
            sleep 5
          done

          test "$cloned" -eq 1

          source_dir="$(find . -mindepth 2 -maxdepth 2 -type d -name .git -print -quit | sed 's#/.git$##')"
          test -n "$source_dir"
          mv "$source_dir" "$RUNNER_TEMP/radicle-source"
          test -d "$RUNNER_TEMP/radicle-source"
          test -d "$RUNNER_TEMP/radicle-source/.git"

      - name: Check out GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Mirror Radicle working tree
        run: |
          # Preserve GitHub-only files by temporarily moving their parent
          # directories out of the rsync destination. This avoids rsync's
          # --delete interaction with excluded files inside otherwise-empty
          # directories (which caused the previous run to fail).
          mirror_backup="$RUNNER_TEMP/mirror-backup"
          rm -rf "$mirror_backup"
          mkdir -p "$mirror_backup"

          if [ -f "$GITHUB_WORKSPACE/.github/workflows/radicle-sync.yml" ]; then
            mkdir -p "$mirror_backup/.github/workflows"
            cp "$GITHUB_WORKSPACE/.github/workflows/radicle-sync.yml"               "$mirror_backup/.github/workflows/radicle-sync.yml"
          fi

          if [ -f "$GITHUB_WORKSPACE/Input/client.jar" ]; then
            mkdir -p "$mirror_backup/Input"
            cp "$GITHUB_WORKSPACE/Input/client.jar" "$mirror_backup/Input/client.jar"
          fi

          rm -rf "$GITHUB_WORKSPACE/.github" "$GITHUB_WORKSPACE/Input"

          rsync -a --delete             --exclude='.git/'             "$RUNNER_TEMP/radicle-source/" "$GITHUB_WORKSPACE/"

          mkdir -p "$GITHUB_WORKSPACE/.github/workflows" "$GITHUB_WORKSPACE/Input"

          cp "$mirror_backup/.github/workflows/radicle-sync.yml"             "$GITHUB_WORKSPACE/.github/workflows/radicle-sync.yml"

          if [ -f "$mirror_backup/Input/client.jar" ]; then
            cp "$mirror_backup/Input/client.jar" "$GITHUB_WORKSPACE/Input/client.jar"
            echo "Preserved existing client.jar:"
            sha256sum "$GITHUB_WORKSPACE/Input/client.jar"
          else
            echo "No existing client.jar to preserve; it will be downloaded in the next step."
          fi

      - name: Commit and push main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Radicle repository is already synchronized."
          else
            git commit -m "Sync workspace from Radicle"
            git push origin HEAD:main
          fi

      - name: Install Minecraft 26.2 client into Input
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Input"

          client_url="https://piston-data.mojang.com/v1/objects/2dc72797acbc1b63fc16a11c4ac393605f453754/client.jar"
          expected_sha256="40896ee9f1e2bec3c934daac7e93d41e9e3d9c2f8ae0ca366d52ffbfd1afa290"
          expected_size="39193383"

          echo "Downloading official Minecraft 26.2 client JAR..."
          curl -fL --retry 5 --retry-delay 2 -o "$GITHUB_WORKSPACE/Input/client.jar.tmp" "$client_url"

          actual_size="$(stat -c '%s' "$GITHUB_WORKSPACE/Input/client.jar.tmp")"
          actual_sha256="$(sha256sum "$GITHUB_WORKSPACE/Input/client.jar.tmp" | cut -d ' ' -f 1)"

          echo "client.jar size:   $actual_size"
          echo "client.jar sha256: $actual_sha256"

          test "$actual_size" = "$expected_size"
          test "$actual_sha256" = "$expected_sha256"

          mv "$GITHUB_WORKSPACE/Input/client.jar.tmp" "$GITHUB_WORKSPACE/Input/client.jar"

          echo "Minecraft 26.2 client installed:"
          ls -lh "$GITHUB_WORKSPACE/Input/client.jar"

      - name: Commit client input to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # client.jar is intentionally ignored by the source workspace's .gitignore, but this workflow installs it as a required input.
          git add -f Input/client.jar

          if git diff --cached --quiet; then
            echo "Input/client.jar is already synchronized."
          else
            git commit -m "Install Minecraft 26.2 client input"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the complete patcher kit
        run: |
          rm -rf "$RUNNER_TEMP/eaglercraft-patcher"
          curl -fL             -o "$RUNNER_TEMP/eaglercraft-26.2-u1-Setup.jar"             "https://eaglercraft-26-2-u1-cdn.u2471966200.workers.dev/Eaglercraft-26.2-u1-Setup.jar"
          test -s "$RUNNER_TEMP/eaglercraft-26.2-u1-Setup.jar"

          java -jar "$RUNNER_TEMP/eaglercraft-26.2-u1-Setup.jar"             --install-dir "$RUNNER_TEMP/eaglercraft-patcher"

          echo "Installed patcher contents:"
          find "$RUNNER_TEMP/eaglercraft-patcher" -maxdepth 4 -type f -printf '%P\\n' | sort
          echo "Installed patcher directories:"
          find "$RUNNER_TEMP/eaglercraft-patcher" -maxdepth 4 -type d -printf '%P/\\n' | sort

          required_files=(
            "eaglercraft-26.2-java-cli.jar"
            "inputs/vineflower-1.12.0.jar"
            "inputs/source-patch-bundle.zip"
            "inputs/project-skeleton-v5-teavm-runtime-verified.zip"
            "inputs/resource-overlay-normal.zip"
          )

          for relative_path in "${required_files[@]}"; do
            if [ ! -s "$RUNNER_TEMP/eaglercraft-patcher/$relative_path" ]; then
              echo "::error::Required patcher file is missing or empty: $relative_path"
              exit 1
            fi
            echo "Verified: $relative_path"
          done

          if [ ! -d "$RUNNER_TEMP/eaglercraft-patcher/inputs/resources" ]; then
            echo "::error::Required patcher resource directory is missing: inputs/resources"
            exit 1
          fi
          echo "Verified: inputs/resources/"

      - name: Verify client input
        run: |
          expected_size=39193383
          expected_sha256=40896ee9f1e2bec3c934daac7e93d41e9e3d9c2f8ae0ca366d52ffbfd1afa290

          actual_size="$(stat -c '%s' "$GITHUB_WORKSPACE/Input/client.jar")"
          actual_sha256="$(sha256sum "$GITHUB_WORKSPACE/Input/client.jar" | cut -d ' ' -f 1)"

          echo "client.jar size:   $actual_size"
          echo "client.jar sha256: $actual_sha256"

          test "$actual_size" = "$expected_size"
          test "$actual_sha256" = "$expected_sha256"

      - name: Create complete Eaglercraft source project
        run: |
          rm -rf "$RUNNER_TEMP/generated-project"

          java -jar "$RUNNER_TEMP/eaglercraft-patcher/eaglercraft-26.2-java-cli.jar"             create-dev             --jar "$GITHUB_WORKSPACE/Input/client.jar"             --output "$RUNNER_TEMP/generated-project"             --vineflower "$RUNNER_TEMP/eaglercraft-patcher/inputs/vineflower-1.12.0.jar"             --java17 "$JAVA_HOME/bin/java"             --patch-bundle "$RUNNER_TEMP/eaglercraft-patcher/inputs/source-patch-bundle.zip"             --expected-bundle-sha256 fd944e9cabbebbf4bddce8a39e1b233b3c7d0cd4f860f9cae37550a3fcfa8b02             --project-skeleton "$RUNNER_TEMP/eaglercraft-patcher/inputs/project-skeleton-v5-teavm-runtime-verified.zip"             --expected-skeleton-sha256 3656a83ed8187e2d859612c566f3aa73e242bf1e4633990c5bb4929e0a846c94             --resource-overlay "$RUNNER_TEMP/eaglercraft-patcher/inputs/resource-overlay-normal.zip"             --expected-resource-overlay-sha256 2ba7e3376891c64f8bf57f3687e05b8dbe1971a75475b6825449e5e5f96d71f3             --external-resource-root "$RUNNER_TEMP/eaglercraft-patcher/inputs/resources"

          test -s "$RUNNER_TEMP/generated-project/receipt.json"
          test -d "$RUNNER_TEMP/generated-project/game/src/main/java"
          test -d "$RUNNER_TEMP/generated-project/platform"
          test -d "$RUNNER_TEMP/generated-project/target_teavm_wasm_gc"

          java_files="$(find "$RUNNER_TEMP/generated-project" -type f -name '*.java' | wc -l)"
          echo "Generated Java files: $java_files"
          test "$java_files" -ge 7000

          echo "Generated project size:"
          du -sh "$RUNNER_TEMP/generated-project"

      - name: Publish complete source project to src branch
        run: |
          git fetch origin main src || true
          git checkout -B src origin/main

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +

          rsync -a --delete             --exclude='.git/'             "$RUNNER_TEMP/generated-project/" ./

          test -s receipt.json
          test -d game/src/main/java
          test -d platform

          git add -A

          if git diff --cached --quiet; then
            echo "Generated source project is already synchronized on src."
            exit 0
          fi

          git commit -m "Generate Eaglercraft 26.2 source project"
          git push --force-with-lease origin HEAD:src
