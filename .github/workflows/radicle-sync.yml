name: Sync from Radicle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: radicle-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Radicle
        run: |
          curl -sSLf https://radicle.xyz/install | sh
          export PATH="$HOME/.radicle/bin:$PATH"
          echo "$HOME/.radicle/bin" >> "$GITHUB_PATH"
          rad --version

      - name: Clone Radicle repository
        run: |
          export PATH="$HOME/.radicle/bin:$PATH"
          rm -rf radicle-source
          rad clone rad:z2BWVCwcwTyoQ2veMJLb1eFpMtJDj radicle-source
          test -d radicle-source
          test -d radicle-source/.git

      - name: Check out GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror Radicle working tree
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/radicle-sync.yml' \
            radicle-source/ ./

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Radicle repository is already synchronized."
            exit 0
          fi

          git commit -m "Sync workspace from Radicle"
          git push origin HEAD:main
