name: Sync from Radicle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: radicle-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install Radicle
        run: |
          curl -sSLf https://radicle.xyz/install | sh
          export PATH="$HOME/.radicle/bin:$PATH"
          echo "$HOME/.radicle/bin" >> "$GITHUB_PATH"
          rad --version

      - name: Initialize Radicle profile
        run: |
          export PATH="$HOME/.radicle/bin:$PATH"
          rad auth --alias "github-actions-bot" --stdin < /dev/null

      - name: Clone Radicle repository
        run: |
          export PATH="$HOME/.radicle/bin:$PATH"
          rm -rf radicle-source
          rad node start

          echo "Waiting for the Radicle node to come online..."
          for i in {1..30}; do
            if rad node status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          rad node status

          echo "Waiting for Radicle seed discovery..."
          for attempt in {1..12}; do
            echo "Clone attempt $attempt/12"

            # Keep the clone command unqualified so Radicle discovers the repository
            # from its connected/default seeds.
            if rad clone rad:z2BWVCwcwTyoQ2veMJLb1eFpMtJDj; then
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "Radicle repository could not be discovered after 12 attempts."
              rad node status || true
              rad node logs --tail 100 || true
              exit 1
            fi

            echo "No usable seed yet; waiting 5 seconds before retrying..."
            find . -mindepth 1 -maxdepth 1 -type d ! -name .git ! -name .github -exec rm -rf {} +
            sleep 5
          done

          # rad clone chooses the checkout directory from the repository name.
          # Locate that checkout instead of guessing its directory name.
          source_dir="$(find . -mindepth 2 -maxdepth 2 -type d -name .git -print -quit | sed 's#/.git$##')"
          test -n "$source_dir"
          mv "$source_dir" radicle-source
          test -d radicle-source
          test -d radicle-source/.git

      - name: Check out GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror Radicle working tree
        run: |
          rsync -a --delete             --exclude='.git/'             --exclude='.github/workflows/radicle-sync.yml'             radicle-source/ ./

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Radicle repository is already synchronized."
            exit 0
          fi

          git commit -m "Sync workspace from Radicle"
          git push origin HEAD:main
